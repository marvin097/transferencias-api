# Ambiente: prod
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

core:
  url: ${CORE_URL}
  username: ${CORE_USER}
  password: ${CORE_PASSWORD}

logging:
  level:
    com.izalco.transferencias: WARN

# En producción no se expone la consola de pruebas.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
