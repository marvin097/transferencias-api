openapi: 3.0.3
info:
  title: API de Transferencias Interbancarias - Banco Izalco Digital
  version: 1.0.0
  description: |
    Registro y consulta de transferencias interbancarias para la app móvil.

    **Idempotencia:** todo POST requiere `X-Idempotency-Key` (una llave nueva por cada transferencia que el
    cliente quiere hacer, por ejemplo un UUID).
    - Misma llave y mismo contenido: se devuelve el resultado original, sin volver a enviar al core
      (header `Idempotent-Replayed: true`).
    - Misma llave con contenido distinto: `409 CONFLICTO_IDEMPOTENCIA`.
    - Si la respuesta fue `503 CORE_NO_DISPONIBLE`, se puede reintentar con la **misma** llave.

    **Errores:** todos los errores usan RFC 9457 (`application/problem+json`) con un campo `codigo` estable.
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: Transferencias
paths:
  /transferencias:
    post:
      tags: [Transferencias]
      operationId: registrarTransferencia
      summary: Registra una transferencia interbancaria
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferenciaRequest'
      responses:
        '201':
          description: Transferencia aprobada por el core.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaResponse'
        '202':
          description: |
            El core no respondió a tiempo y el resultado es incierto (estado EN_VERIFICACION).
            No se reenvía al core. Consultar el estado con GET usando el header Location.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaResponse'
        '400':
          description: Solicitud inválida (SOLICITUD_INVALIDA) o falta la llave de idempotencia (IDEMPOTENCY_KEY_INVALIDA).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La llave ya se usó con otro contenido (CONFLICTO_IDEMPOTENCIA) o hay otra solicitud en proceso (SOLICITUD_EN_PROCESO).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Rechazo de negocio del core. Código 51 = SALDO_INSUFICIENTE, 62 = CUENTA_BLOQUEADA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                type: about:blank
                title: SALDO_INSUFICIENTE
                status: 422
                detail: La cuenta de origen no tiene saldo suficiente.
                codigo: SALDO_INSUFICIENTE
                transferenciaId: 3f1c2a9e-5b7d-4c1e-9a2f-1d2e3f4a5b6c
        '502':
          description: El core devolvió un código no reconocido (RESPUESTA_CORE_INVALIDA).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Core no disponible (código 91 o sin conexión). Es seguro reintentar con la misma llave.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de reintentar.
              schema:
                type: integer
                example: 30
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /transferencias/{id}:
    get:
      tags: [Transferencias]
      operationId: obtenerTransferencia
      summary: Consulta una transferencia por su id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transferencia encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaResponse'
        '404':
          description: No existe (TRANSFERENCIA_NO_ENCONTRADA).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Llave única por transferencia (8 a 100 caracteres alfanuméricos, '-' o '_'). Se recomienda un UUID.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{8,100}$'
        example: 7b0e8f8a-2c55-4c3e-8d0f-6f1b2a3c4d5e
  headers:
    Location:
      description: URL de la transferencia creada.
      schema:
        type: string
        example: /transferencias/3f1c2a9e-5b7d-4c1e-9a2f-1d2e3f4a5b6c
    IdempotentReplayed:
      description: true si la respuesta es la repetición de una solicitud anterior con la misma llave.
      schema:
        type: boolean
  schemas:
    TransferenciaRequest:
      type: object
      required: [cuentaOrigen, cuentaDestino, bancoDestino, monto, moneda, concepto, fechaSolicitud]
      properties:
        cuentaOrigen:
          type: string
          pattern: '^\d{6,20}$'
          example: '100200300'
        cuentaDestino:
          type: string
          pattern: '^\d{6,20}$'
          example: '900800700'
        bancoDestino:
          type: string
          pattern: '^[A-Z]{3}-\d{4}$'
          example: BIZ-0042
        monto:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          example: 150.75
        moneda:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Código ISO 4217.
          example: USD
        concepto:
          type: string
          maxLength: 140
          description: Se envía al core en mayúsculas, sin tildes y recortado a 30 caracteres.
          example: Pago de alquiler
        fechaSolicitud:
          type: string
          format: date-time
          description: Debe incluir zona horaria. Se convierte a UTC para el core.
          example: '2026-10-01T14:32:10-06:00'
    TransferenciaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        estado:
          type: string
          enum: [PROCESANDO, APROBADA, RECHAZADA, EN_VERIFICACION, CORE_NO_DISPONIBLE]
        cuentaOrigen:
          type: string
          description: Enmascarada, solo últimos 4 dígitos.
          example: '*****0300'
        cuentaDestino:
          type: string
          example: '*****0700'
        bancoDestino:
          type: string
          example: BIZ-0042
        monto:
          type: number
          example: 150.75
        moneda:
          type: string
          example: USD
        concepto:
          type: string
          example: Pago de alquiler
        fechaSolicitud:
          type: string
          format: date-time
          description: En UTC.
          example: '2026-10-01T20:32:10Z'
        referenciaCore:
          type: string
          nullable: true
          example: REF-0001
        motivo:
          type: string
          nullable: true
          example: null
        registradaEn:
          type: string
          format: date-time
    Error:
      type: object
      description: RFC 9457 Problem Details.
      required: [title, status, codigo]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        codigo:
          type: string
          enum:
            - SOLICITUD_INVALIDA
            - IDEMPOTENCY_KEY_INVALIDA
            - TRANSFERENCIA_NO_ENCONTRADA
            - CONFLICTO_IDEMPOTENCIA
            - SOLICITUD_EN_PROCESO
            - SALDO_INSUFICIENTE
            - CUENTA_BLOQUEADA
            - RESPUESTA_CORE_INVALIDA
            - CORE_NO_DISPONIBLE
            - ERROR_INTERNO
        transferenciaId:
          type: string
          format: uuid
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
